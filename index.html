<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Skein Legal</title>
<style>
:root { --primary:#9A3F2C; --surface:#FFF8F5; --card:#FFFFFF; --text:#201B18; --muted:#5E4F4A; --line:#E8D7D1; }
@media (prefers-color-scheme: dark) {
  :root { --primary:#FFB4A4; --surface:#1A1210; --card:#241A17; --text:#F1DFD9; --muted:#C9B5AF; --line:#3B2C28; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--surface); color:var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; line-height:1.2; margin: 0 0 8px; color: var(--primary); }
h2 { font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; margin: 2rem 0 .5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
h3 { font-size: 1.05rem; margin: 1.4rem 0 .4rem; }
a { color: var(--primary); }
code { font-size: .9em; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
table { width:100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; background: var(--card); }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { color: var(--primary); }
blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 3px solid var(--primary); background: var(--card); }
nav.top { display:flex; gap:16px; font-size:.9rem; margin-bottom: 24px; }
footer { margin-top: 48px; font-size: .85rem; color: var(--muted); }
.cards a { display:block; padding:18px 20px; margin:12px 0; background:var(--card); border:1px solid var(--line); border-radius:14px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>

<h1>Skein</h1><p>Legal documents for the Skein app.</p>
<div class="cards"><a href="skein/terms/">Terms of Use</a><a href="skein/privacy/">Privacy Policy</a></div>
<footer>&copy; 2026 Skein. Contact: <a href="mailto:Skeincontact@gmail.com">Skeincontact@gmail.com</a></footer>
</main>
</body>
</html>
